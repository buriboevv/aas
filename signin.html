<link rel="stylesheet" href="csc.css">
<div id="signin-modal" class="modal-backdrop">
  <div class="modal-box">
    <button class="modal-close">&times;</button>
    <h2 class="modal-title">Sign in</h2>
    <p style="text-align: center; color: var(--gray-700); margin-bottom: 24px; font-size: 14px;">Welcome back! Please enter your details.</p>
    <form>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" placeholder="Your working email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">Sign in</button>
      <p style="text-align: center; font-size: 14px;">Don't have an account? <a href="#" style="color: var(--primary); font-weight: 700;">Sign up</a></p>
    </form>
  </div>
</div>
